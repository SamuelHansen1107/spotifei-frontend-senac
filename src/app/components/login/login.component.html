<div class="div-principal">
    <div class="div-formulario">
        <div class="div-titulo">
            <h1>Spotifei</h1>
        </div>
        <form (submit)="fazerLogin()">
            <div class="div-input">
                <label for="email">E-mail SENAC:</label>
                <input type="email" id="email" name="email" [(ngModel)]="email" placeholder="email@senac.com"
                    required />
            </div>
            <div class="div-input">
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" [(ngModel)]="senha" placeholder="sua senha" required />
            </div>

            <div class="div-formulario-inferior">
                <div class="div-lembrar-email">
                    <input type="checkbox" id="lembrarEmail" [(ngModel)]="lembrarEmail" name="lembrarEmail" />
                    <label for="lembrarEmail">Lembrar meu email</label>
                </div>
                <a href="#">Esqueci minha senha</a>
            </div>

            <div class="div-button-entrar">
                <button type="submit">Entrar</button>
            </div>
        </form>
        <div class="div-cadastre-se">
            <a routerLink="/cadastro">Ou Cadastre-se</a>
        </div>
    </div>
</div>
